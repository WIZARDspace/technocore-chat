# The automated half of CONTRIBUTING.md "Overlapping work": one comment naming open PRs
# that cite the same issues, and a failure on PRs editing maintainer-regenerated files.
# Runs on pull_request_target and never checks out PR code — both jobs read only the API,
# so an untrusted branch gets no execution here.
name: queue-guard
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  protected-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // CHANGELOG.md is folded at release and sz-baseline.json regenerated by
            // maintainers (CONTRIBUTING.md) — the two files behind most queue conflicts.
            // Two ways to be a maintainer here, because author_association alone is not
            // one: it failed #567, whose author the API reports as MEMBER. A head branch
            // in this repository is the fact that cannot be wrong — pushing one needs
            // write access, and the fork PRs this guard is for never have it.
            const pr = context.payload.pull_request;
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association)) return;
            if (pr.head.repo && pr.head.repo.full_name === pr.base.repo.full_name) return;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number,
            });
            const hit = files.map(f => f.filename)
              .filter(n => n === 'CHANGELOG.md' || n === 'sz-baseline.json');
            if (hit.length) core.setFailed(
              hit.join(', ') + ': maintainer-regenerated — drop this change from the PR. ' +
              'Proposed release-note wording goes in the PR body; if a size cap binds, ' +
              'propose the missing primitive instead (CONTRIBUTING.md "Overlapping work").');

  overlap:
    if: github.event.action == 'opened' || github.event.action == 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // PR text is reduced to bare #N issue numbers before anything reaches the
            // search query; the comment is upserted by marker so each PR carries at most
            // one, and it is removed if the overlap goes away.
            const pr = context.payload.pull_request;
            const refs = [...new Set((pr.title + ' ' + (pr.body || '')).match(/#\d+/g) || [])];
            const found = new Map();
            // The search is a prefilter, not the answer. GitHub's tokenizer does not treat
            // '#' as part of a word, so a query for "#607" is really a query for the token
            // 607 and matches any text containing those digits — a byte count, a timing, a
            // throughput figure. That is how #271 came to be reported as citing #607: its
            // body measures 6,607 appends/s, and '6,607' tokenizes on the comma. PR bodies
            // here carry measurements routinely, so this is the common case, not a corner.
            // Every hit is therefore re-checked against the text the search already returns
            // (free — no extra request), and only a literal reference survives.
            const cites = (item, ref) => {
              const n = ref.slice(1);
              // '#N' or an issues/N | pull/N URL tail, and not the prefix of a longer
              // number: #607 must not answer for #6071.
              const rx = new RegExp('(#|(?:issues|pull)\\/)' + n + '(?!\\d)');
              return rx.test((item.title || '') + ' ' + (item.body || ''));
            };
            for (const ref of refs.slice(0, 8)) {
              const q = 'repo:' + context.repo.owner + '/' + context.repo.repo +
                ' is:pr is:open "' + ref + '" in:title,body';
              const res = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
              for (const item of res.data.items)
                if (item.number !== pr.number && !found.has(item.number) && cites(item, ref))
                  found.set(item.number, ref);
            }
            const marker = '<!-- queue-guard-overlap -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (!found.size) {
              if (mine) await github.rest.issues.deleteComment(
                { ...context.repo, comment_id: mine.id });
              return;
            }
            const lines = [...found].map(([n, ref]) => '- #' + n + ' (also cites ' + ref + ')');
            const body = marker + '\nOpen pull requests citing the same issues:\n\n' +
              lines.join('\n') + '\n\nIf one already covers this change, review or build ' +
              'on it instead of racing it (CONTRIBUTING.md "Overlapping work").';
            if (mine) await github.rest.issues.updateComment(
              { ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment(
              { ...context.repo, issue_number: pr.number, body });

  ci-not-run:
    # #693: a fork PR from an author with no merged PR here has its CI run created as
    # `action_required` and never executed. Nothing on the PR says so — `protected-files`
    # reports success and `overlap` reports skipped, so the checks list looks populated,
    # and the only hint is `mergeable_state: blocked`, which does not say why. This says
    # why, once, in the thread where people are already looking.
    #
    # It does not change the gate. Approving the run stays a maintainer action; this only
    # makes the wait legible so an approval is not read as "the repo's gate passed".
    if: >-
      github.event.action == 'opened' || github.event.action == 'reopened'
      || github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      # Narrower than the workflow default: this job reads run state and writes one
      # comment, so it needs `actions: read` on top of the comment scope, and nothing else.
      pull-requests: write
      actions: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // Same fork test as protected-files: a head branch in this repository cannot
            // be a fork, and only forks are gated. author_association is not consulted --
            // it reports MEMBER for authors who still need approval (see #567).
            const pr = context.payload.pull_request;
            if (pr.head.repo && pr.head.repo.full_name === pr.base.repo.full_name) return;
            const marker = '<!-- queue-guard-ci-not-run -->';
            // `pull_request` and `pull_request_target` dispatch from the same push, so the
            // CI run may not be listed yet when this job reaches the API. Poll briefly
            // rather than reporting "never ran" against a run that is seconds from
            // existing -- a false positive here is worse than a late comment, because it
            // says the opposite of the truth on a PR that is fine.
            const CI = '.github/workflows/ci.yml';
            let run = null;
            for (let i = 0; i < 6 && !run; i++) {
              if (i) await new Promise(r => setTimeout(r, 10000));
              const res = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: pr.head.sha, per_page: 100,
              });
              // Matched on path, not display name: the name is prose and can be edited
              // without anyone thinking of this file.
              run = res.data.workflow_runs.find(r => r.path === CI) || null;
            }
            // Only `action_required` is reported. A queued or running CI is not a problem,
            // and no run at all after the poll is ambiguous -- it can mean the event was
            // filtered -- so it stays silent rather than guessing.
            const blocked = run !== null && run.conclusion === 'action_required';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (!blocked) {
              // Upserted and removed by marker, like the overlap comment: once the run is
              // approved the notice is wrong, and a stale warning is its own bug.
              if (mine) await github.rest.issues.deleteComment(
                { ...context.repo, comment_id: mine.id });
              return;
            }
            const body = marker + '\nCI has not run on this head: the workflow run was ' +
              'created as `action_required` and is waiting for a maintainer to approve ' +
              'it. Until then the checks above do not mean the repo\'s gate passed — ' +
              '`lint + tests + image` has not executed at all.\n\nThis is the default ' +
              '"require approval for first-time contributors" setting, not anything ' +
              'wrong with this pull request, and it clears once a maintainer releases ' +
              'the run (#693).';
            if (mine && mine.body === body) return;
            if (mine) await github.rest.issues.updateComment(
              { ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment(
              { ...context.repo, issue_number: pr.number, body });
